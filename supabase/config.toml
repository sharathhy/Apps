# Supabase CLI project config (used by `supabase start` and `supabase db push`).
project_id = "wellness-suite"

[auth]
site_url = "http://localhost:8081"
additional_redirect_urls = ["wellness://auth-callback", "http://localhost:8081/auth-callback"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
